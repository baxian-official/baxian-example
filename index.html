<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>baxian example</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #21352e; background: #f3f5f0; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
      main { box-sizing: border-box; width: min(100% - 2rem, 32rem); padding: 2rem; background: white; border: 1px solid #dce3d9; border-radius: 1.5rem; }
      h1 { margin: .5rem 0; font-size: 2rem; letter-spacing: -.04em; }
      p { line-height: 1.7; }
      .eyebrow { font-size: .75rem; letter-spacing: .1em; color: #527160; }
      label { display: block; margin: 1.5rem 0 .5rem; }
      input, button { box-sizing: border-box; width: 100%; padding: .8rem 1rem; font: inherit; border-radius: .6rem; }
      input { border: 1px solid #9eafa2; background: #fff; }
      button { margin-top: .7rem; background: #24563e; color: white; border: 0; cursor: pointer; }
      input:focus-visible, button:focus-visible { outline: 3px solid #84b79d; outline-offset: 3px; }
      output { display: block; margin-top: 1.5rem; padding: 1rem; background: #eef5ee; border-radius: .6rem; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">baxian example</span>
      <h1>从一句问候开始</h1>
      <p>一个小项目，体验从提出需求到代码评审与合并。</p>
      <form id="greeting-form">
        <label for="name">你的名字</label>
        <input id="name" name="name" value="baxian" autocomplete="given-name">
        <button type="submit">生成问候</button>
      </form>
      <output id="greeting" for="name" aria-live="polite">Hello, baxian!</output>
    </main>
    <script type="module">
      import { greet } from './hello.js';
      const form = document.querySelector('#greeting-form');
      const name = document.querySelector('#name');
      const greeting = document.querySelector('#greeting');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        greeting.textContent = greet(name.value);
      });
    </script>
  </body>
</html>
